{{define "base.html"}}<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeployHub</title>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
<link href="/static/css/output.css" rel="stylesheet">
<style>
* { scrollbar-width: thin; scrollbar-color: #27272A #09090B; }
body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
</style>
<script>
function copyContent(el) {
  var pre = el.parentElement.querySelector('pre');
  if (pre) navigator.clipboard.writeText(pre.textContent).catch(function(){});
}
</script>
</head>
<body class="bg-zinc-950 text-zinc-50 font-sans antialiased">
<div class="flex min-h-screen">
  <nav class="w-56 shrink-0 border-r border-zinc-800 flex flex-col">
    <div class="px-6 py-5 border-b border-zinc-800">
      <a href="/" class="text-lg font-semibold tracking-tight">DeployHub</a>
    </div>
    <div class="flex-1 px-3 py-4 space-y-1">
      <a href="/" class="flex items-center gap-2 px-3 py-2 text-sm rounded-md text-zinc-400 hover:text-zinc-50 hover:bg-zinc-800/50 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Dashboard
      </a>
      <a href="/projects" class="flex items-center gap-2 px-3 py-2 text-sm rounded-md text-zinc-400 hover:text-zinc-50 hover:bg-zinc-800/50 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
        Projects
      </a>
      <a href="/traefik" class="flex items-center gap-2 px-3 py-2 text-sm rounded-md text-zinc-400 hover:text-zinc-50 hover:bg-zinc-800/50 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Traefik
      </a>
      <a href="/settings" class="flex items-center gap-2 px-3 py-2 text-sm rounded-md text-zinc-400 hover:text-zinc-50 hover:bg-zinc-800/50 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        Settings
      </a>
    </div>
    {{if .Data.Username}}
    <div class="px-3 py-4 border-t border-zinc-800">
      <div class="flex items-center justify-between px-3">
        <span class="text-sm text-zinc-400 truncate">{{.Data.Username}}</span>
        <form action="/logout" method="post" class="inline">
          <button class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors">Logout</button>
        </form>
      </div>
    </div>
    {{end}}
  </nav>
  <main class="flex-1 min-w-0">
    <div class="max-w-6xl mx-auto px-8 py-8">
      {{.Content}}
    </div>
  </main>
</div>
</body>
</html>{{end}}
